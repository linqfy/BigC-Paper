    geyserDisplayEntity: [url: "https://api.github.com/repos/GeyserExtensionists/GeyserDisplayEntity/releases/assets/510239319",
                sha256: "eb05806386dc9a614def3cb71b559d1f0d0f5b5b0e1fff51c063a3515832addf",
                dest: "run-server/plugins/Geyser-Spigot/extensions/GeyserDisplayEntity-1.0.12.jar"],
    geyserDisplayEntityPack: [url: "https://api.github.com/repos/GeyserExtensionists/GeyserDisplayEntity/releases/assets/368620700",
                sha256: "7b9b69dbbbc8d2a43e85393a2e1f77118412ad788e5a9298bb64fcc65cbea4fa",
                dest: "run-server/plugins/Geyser-Spigot/packs/GeyserDisplayEntityPack.mcpack"],
]

/** Baja un archivo a un temporal, verifica su sha256 y recien ahi lo mueve al destino (de una sola vez). */
abstract class VerifiedDownload extends DefaultTask {
    @Input
    abstract Property<String> getSourceUrl()

    @Input
    abstract Property<String> getSha256()

    @OutputFile
    abstract RegularFileProperty getDestination()

    @TaskAction
    void download() {
        java.nio.file.Path target = destination.get().asFile.toPath()
        java.nio.file.Files.createDirectories(target.parent)
        if (java.nio.file.Files.isRegularFile(target) && digest(target).equalsIgnoreCase(sha256.get())) {
            return
        }
        java.nio.file.Path temp = java.nio.file.Files.createTempFile(temporaryDir.toPath(), "download-", ".part")
        try {
            def client = java.net.http.HttpClient.newBuilder()
                .followRedirects(java.net.http.HttpClient.Redirect.NORMAL)
                .connectTimeout(java.time.Duration.ofSeconds(30))
                .build()
            def request = java.net.http.HttpRequest.newBuilder(URI.create(sourceUrl.get()))
                .header("Accept", "application/octet-stream")
                .header("User-Agent", "BigCasares-build")
                .timeout(java.time.Duration.ofMinutes(5))
                .GET()
                .build()
            def response = client.send(request, java.net.http.HttpResponse.BodyHandlers.ofFile(temp))
            if (response.statusCode() != 200) {
                throw new GradleException("HTTP ${response.statusCode()} al bajar ${sourceUrl.get()}")
            }
            String actual = digest(temp)
            if (!actual.equalsIgnoreCase(sha256.get())) {
                throw new GradleException("Checksum distinto para ${sourceUrl.get()}: se esperaba sha256 ${sha256.get()}"
                    + " y llego ${actual}. Si upstream publico una version nueva, actualizar el id y el sha256.")
            }
            try {
                java.nio.file.Files.move(temp, target, java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
                java.nio.file.Files.move(temp, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        } finally {
            java.nio.file.Files.deleteIfExists(temp)
        }
    }

    private static String digest(java.nio.file.Path file) {
        def md = java.security.MessageDigest.getInstance("SHA-256")
        file.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int read
            while ((read = input.read(buffer)) != -1) {
                md.update(buffer, 0, read)
            }
        }
        return java.util.HexFormat.of().formatHex(md.digest())
    }
}

def verifiedTasks = verifiedArtifacts.collectEntries { name, artifact ->
    [(name): tasks.register("download${name.capitalize()}", VerifiedDownload) {
        group = "run paper"
        description = "Downloads ${artifact.dest} and verifies its sha256."
        sourceUrl = artifact.url
        sha256 = artifact.sha256
        destination = layout.buildDirectory.file(artifact.dest)
    }]
}

tasks.register("downloadGeyserExtensions") {
    group = "run paper"
    description = "Downloads the verified Geyser extensions and resource pack used for Bedrock players."
    dependsOn(verifiedArtifacts.findAll { !it.value.plugin }.keySet().collect { verifiedTasks[it] })
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("26.2")
        runDirectory.set(layout.buildDirectory.dir("run-server"))
        dependsOn(tasks.named("downloadGeyserExtensions"))
        // los plugins verificados que no estan en Modrinth (Gradle sabe que dependen de su tarea de descarga)
        verifiedArtifacts.findAll { it.value.plugin }.each { name, artifact ->
            pluginJars(verifiedTasks[name].flatMap { it.destination })
        }
        downloadPlugins {
            modrinthPlugins.each { modrinth(it.project, it.version) }
        }
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.register("prepareBetterModelTestAssets", Copy) {
    group = "verification"
    description = "Copies packaged BetterModel model sources into the local run-server directory used by asset contract tests."
    from(layout.projectDirectory.dir("src/main/resources/bettermodel/models"))
    into(layout.buildDirectory.dir("run-server/plugins/BetterModel/models"))
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    dependsOn(tasks.named("prepareBetterModelTestAssets"))
}

def generatedResourcePackDirectory = layout.buildDirectory.dir("generated-resourcepacks")
def generatedResourcePackSeedDirectory = layout.buildDirectory.dir("generated-resourcepack-seed")

tasks.register("generateResourcePackSeed", Zip) {
    group = "build"
    description = "Packages editable BigCasares resource-pack sources as a reproducible runtime seed."
    from(layout.projectDirectory.dir("resourcepack"))
    destinationDirectory.set(generatedResourcePackSeedDirectory)
    archiveFileName.set("bigcasares-content-seed.zip")
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register("generateResourcePacks", JavaExec) {
    group = "build"
    description = "Validates and builds the BigCasares Java and Bedrock resource packs."
    dependsOn(tasks.named("classes"))
    mainClass = "dev.linqfy.bigCasares.modules.resourcepack.ResourcePackBuildMain"
    classpath = sourceSets.main.runtimeClasspath
    args = [
        layout.projectDirectory.dir("resourcepack").asFile.absolutePath,
        generatedResourcePackDirectory.get().asFile.absolutePath
    ]
    inputs.dir(layout.projectDirectory.dir("resourcepack"))
    outputs.dir(generatedResourcePackDirectory)
}

tasks.named("jar") {
    dependsOn(tasks.named("generateResourcePacks"), tasks.named("generateResourcePackSeed"))
    from(generatedResourcePackDirectory) {
        into("generated-resourcepacks")
    }
    from(tasks.named("generateResourcePackSeed")) {
        into("seed-content")
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
