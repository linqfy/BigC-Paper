plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.0.2"
}

group = 'dev.linqfy'
version = '0.0.1'

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "spigotmc"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "codemc"
        url = "https://repo.codemc.io/repository/maven-releases/"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/releases/"
    }
    maven {
        name = "opencollab"
        url = "https://repo.opencollab.dev/main/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.2.build.56-alpha")
    compileOnly("io.github.toxicity188:bettermodel-bukkit-api:3.2.0")
    compileOnly("com.github.MilkBowl:VaultAPI:1.7") {
        exclude group: "org.bukkit", module: "bukkit"
    }
    compileOnly("me.clip:placeholderapi:2.12.3")
    compileOnly("org.geysermc.geyser:api:2.11.0-SNAPSHOT")
    implementation("com.pocketcombats:openskill:1.1")
    implementation("org.xerial:sqlite-jdbc:3.50.3.0")
    implementation("net.dv8tion:JDA:6.4.1") {
        exclude group: "club.minnced", module: "opus-java"
    }
    // Unit tests use the matching Spigot API because Paper's ItemStack factory
    // requires a live RegistryAccess implementation. Paper-specific behavior is
    // exercised by run-paper against the real 26.2 server below.
    testImplementation("org.spigotmc:spigot-api:26.2-R0.1-SNAPSHOT")
    testImplementation("com.github.MilkBowl:VaultAPI:1.7") {
        exclude group: "org.bukkit", module: "bukkit"
    }
    testImplementation("me.clip:placeholderapi:2.12.3")
    testRuntimeOnly("io.github.toxicity188:bettermodel-bukkit-api:3.2.0")
    testImplementation(platform("org.junit:junit-bom:5.11.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

// Plugins del servidor (no se compilan con BigCasares): runServer los pone en build/run-server/plugins.
// Bedrock (Geyser + Floodgate) y GeyserModelEngine para que los de Bedrock vean los modelos de BetterModel.
// Ver docs/don-pollos/compatibilidad-bedrock.md.
//
// Todas las descargas estan fijadas a una version que no cambia y se verifican con el checksum oficial:
// - Modrinth: id de version fijo; run-paper verifica el sha512 que publica Modrinth.
// - El resto: URL fija + sha256 oficial (GeyserMC o el "digest" de GitHub). Se bajan a un archivo temporal, se
//   verifica el checksum y recien ahi se mueven al destino: una descarga cortada nunca queda como valida.
// Los de GeyserExtensionists solo publican estos archivos en el tag "latest", que se republica: por eso se fija el
// id del archivo (asset) y su digest. Si upstream lo republica, el build falla en vez de cambiar en silencio; para
// actualizar, poner el id y el digest nuevos de https://api.github.com/repos/<repo>/releases/tags/latest.
def modrinthPlugins = [
    // BetterModel: obligatorio (plugin.yml depend). El servidor usa 3.5.0 aunque se compile contra la API 3.2.0.
    [project: "bettermodel", version: "QTU9HP83"],   // 3.5.0
    // Geyser: deja entrar a los jugadores de Bedrock.
    [project: "geyser", version: "sT6fWVgD"],        // 2.11.3-b1249 (26.2)
    // packetevents: GeyserModelEngine no carga sin el.
    [project: "packetevents", version: "m78nFxYg"],  // 2.14.0 (26.2)
]

// dest es relativo a build/. plugin: true = va a plugins/ por runServer; si no, es una extension o pack de Geyser.
def verifiedArtifacts = [
    // Floodgate: los de Bedrock entran sin cuenta de Java.
    floodgate: [url: "https://download.geysermc.org/v2/projects/floodgate/versions/2.2.5/builds/141/downloads/spigot",
                sha256: "21570aff9ce17d6983928e8552777760e1ede5050026b04c686b0ae112e6fd7e",
                dest: "verified-plugins/floodgate-spigot-2.2.5-b141.jar", plugin: true],
    // GeyserUtils (lado servidor) y GeyserModelEngine: modelos 3D para Bedrock.
    geyserUtilsSpigot: [url: "https://api.github.com/repos/GeyserExtensionists/GeyserUtils/releases/assets/528940887",
                sha256: "b39677308d320c00be2a5bf8058296f39789b836cfb448d0c13437b2ecbdec43",
                dest: "verified-plugins/geyserutils-spigot-1.0-SNAPSHOT.jar", plugin: true],
    geyserModelEngine: [url: "https://api.github.com/repos/GeyserExtensionists/GeyserModelEngine/releases/assets/641444897",
                sha256: "6e777d569d7f7c2b8583ba21ba8ac7c451c265089bd34aefdb7f00c2fe8957a2",
                dest: "verified-plugins/GeyserModelEngine-1.0.9.jar", plugin: true],
    // Extensiones de Geyser (plugins/Geyser-Spigot/extensions) y el pack de GeyserDisplayEntity (packs/).
    geyserModelEngineExtension: [url: "https://api.github.com/repos/GeyserExtensionists/GeyserModelEngine/releases/assets/641444959",
                sha256: "9b5e6c9b6e20f5f5aa7516cd32eb635f1a99d4458bd6327b828859cbb2aa4f18",
                dest: "run-server/plugins/Geyser-Spigot/extensions/GeyserModelEngineExtension-1.0.9.jar"],
    geyserUtilsExtension: [url: "https://api.github.com/repos/GeyserExtensionists/GeyserUtils/releases/assets/528940916",
                sha256: "50120094bd46fefbb1672737540e3a66a483391e062625676805b4bb08e79ea9",
                dest: "run-server/plugins/Geyser-Spigot/extensions/geyserutils-geyser-1.0-SNAPSHOT.jar"],
