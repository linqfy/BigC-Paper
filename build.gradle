plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.0.2"
}

group = 'dev.linqfy'
version = '0.0.1'

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "spigotmc"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "codemc"
        url = "https://repo.codemc.io/repository/maven-releases/"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/releases/"
    }
    maven {
        name = "opencollab"
        url = "https://repo.opencollab.dev/main/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.2.build.56-alpha")
    compileOnly("io.github.toxicity188:bettermodel-bukkit-api:3.2.0")
    compileOnly("com.github.MilkBowl:VaultAPI:1.7") {
        exclude group: "org.bukkit", module: "bukkit"
    }
    compileOnly("me.clip:placeholderapi:2.12.3")
    compileOnly("org.geysermc.geyser:api:2.11.0-SNAPSHOT")
    implementation("com.pocketcombats:openskill:1.1")
    implementation("net.dv8tion:JDA:6.4.1") {
        exclude group: "club.minnced", module: "opus-java"
    }
    // Unit tests use the matching Spigot API because Paper's ItemStack factory
    // requires a live RegistryAccess implementation. Paper-specific behavior is
    // exercised by run-paper against the real 26.2 server below.
    testImplementation("org.spigotmc:spigot-api:26.2-R0.1-SNAPSHOT")
    testImplementation("com.github.MilkBowl:VaultAPI:1.7") {
        exclude group: "org.bukkit", module: "bukkit"
    }
    testImplementation("me.clip:placeholderapi:2.12.3")
    testRuntimeOnly("io.github.toxicity188:bettermodel-bukkit-api:3.2.0")
    testImplementation(platform("org.junit:junit-bom:5.11.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

// Plugins del servidor (no se compilan con BigCasares): runServer los baja a build/run-server/plugins.
// Bedrock (Geyser + Floodgate) y GeyserModelEngine para que los de Bedrock vean los modelos de BetterModel.
// Ver docs/don-pollos/compatibilidad-bedrock.md.
def serverPlugins = [
    // BetterModel: obligatorio (plugin.yml depend). El servidor usa 3.5.0 aunque se compile contra la API 3.2.0.
    [modrinth: "bettermodel", version: "QTU9HP83"],                                   // 3.5.0
    // Geyser y Floodgate: dejan entrar a los jugadores de Bedrock.
    [modrinth: "geyser", version: "sT6fWVgD"],                                        // 2.11.3-b1249 (26.2)
    [url: "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot"],
    // GeyserUtils (lado servidor) y GeyserModelEngine: modelos 3D para Bedrock.
    // packetevents: GeyserModelEngine no carga sin el.
    [modrinth: "packetevents", version: "m78nFxYg"],                                  // 2.14.0 (26.2)
    [github: "GeyserExtensionists/GeyserUtils", tag: "latest", asset: "geyserutils-spigot-1.0-SNAPSHOT.jar"],
    [github: "GeyserExtensionists/GeyserModelEngine", tag: "latest", asset: "GeyserModelEngine-1.0.9.jar"],
]

// Extensiones de Geyser: van en plugins/Geyser-Spigot/extensions (y el pack de GeyserDisplayEntity en packs/).
def geyserExtensions = [
    [repo: "GeyserExtensionists/GeyserModelEngine", tag: "latest", asset: "GeyserModelEngineExtension-1.0.9.jar", folder: "extensions"],
    [repo: "GeyserExtensionists/GeyserUtils", tag: "latest", asset: "geyserutils-geyser-1.0-SNAPSHOT.jar", folder: "extensions"],
    // Opcional: meteoritos de WhatsApp y cara del bloque del secreto (item displays) para Bedrock.
    [repo: "GeyserExtensionists/GeyserDisplayEntity", tag: "latest", asset: "GeyserDisplayEntity-1.0.12.jar", folder: "extensions"],
    [repo: "GeyserExtensionists/GeyserDisplayEntity", tag: "latest", asset: "GeyserDisplayEntityPack.mcpack", folder: "packs"],
]

tasks.register("downloadGeyserExtensions") {
    group = "run paper"
    description = "Downloads the Geyser extensions used for Bedrock players into the run-server Geyser folder."
    def geyserFolder = layout.buildDirectory.dir("run-server/plugins/Geyser-Spigot")
    outputs.dir(geyserFolder)
    doLast {
        geyserExtensions.each { extension ->
            File target = geyserFolder.get().dir(extension.folder).file(extension.asset).asFile
            if (!target.isFile()) {
                target.parentFile.mkdirs()
                ant.get(src: "https://github.com/${extension.repo}/releases/download/${extension.tag}/${extension.asset}",
                    dest: target, verbose: false)
            }
        }
    }
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("26.2")
        runDirectory.set(layout.buildDirectory.dir("run-server"))
        dependsOn(tasks.named("downloadGeyserExtensions"))
        downloadPlugins {
            serverPlugins.each { plugin ->
                if (plugin.modrinth) {
                    modrinth(plugin.modrinth, plugin.version)
                } else if (plugin.github) {
                    def (owner, repo) = plugin.github.split("/")
                    github(owner, repo, plugin.tag, plugin.asset)
                } else {
                    url(plugin.url)
                }
            }
        }
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.register("prepareBetterModelTestAssets", Copy) {
    group = "verification"
    description = "Copies packaged BetterModel model sources into the local run-server directory used by asset contract tests."
    from(layout.projectDirectory.dir("src/main/resources/bettermodel/models"))
    into(layout.buildDirectory.dir("run-server/plugins/BetterModel/models"))
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    dependsOn(tasks.named("prepareBetterModelTestAssets"))
}

def generatedResourcePackDirectory = layout.buildDirectory.dir("generated-resourcepacks")
def generatedResourcePackSeedDirectory = layout.buildDirectory.dir("generated-resourcepack-seed")

tasks.register("generateResourcePackSeed", Zip) {
    group = "build"
    description = "Packages editable BigCasares resource-pack sources as a reproducible runtime seed."
    from(layout.projectDirectory.dir("resourcepack"))
    destinationDirectory.set(generatedResourcePackSeedDirectory)
    archiveFileName.set("bigcasares-content-seed.zip")
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register("generateResourcePacks", JavaExec) {
    group = "build"
    description = "Validates and builds the BigCasares Java and Bedrock resource packs."
    dependsOn(tasks.named("classes"))
    mainClass = "dev.linqfy.bigCasares.modules.resourcepack.ResourcePackBuildMain"
    classpath = sourceSets.main.runtimeClasspath
    args = [
        layout.projectDirectory.dir("resourcepack").asFile.absolutePath,
        generatedResourcePackDirectory.get().asFile.absolutePath
    ]
    inputs.dir(layout.projectDirectory.dir("resourcepack"))
    outputs.dir(generatedResourcePackDirectory)
}

tasks.named("jar") {
    dependsOn(tasks.named("generateResourcePacks"), tasks.named("generateResourcePackSeed"))
    from(generatedResourcePackDirectory) {
        into("generated-resourcepacks")
    }
    from(tasks.named("generateResourcePackSeed")) {
        into("seed-content")
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
