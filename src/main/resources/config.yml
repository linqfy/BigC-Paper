bounty-system:
  economy:
    take-percent: 0.30
    bounty-percent: 0.20
    minimum-balance: 100.0
    minimum-bounty: 25.0
  messages:
    payout: "&aCobraste {amount} por la bounty de {victim}."
    new-bounty-victim: "&cTu muerte genero una nueva bounty de {amount}."
    new-bounty-killer: "&e{victim} ahora tiene una nueva bounty de {amount}."
    no-refresh: "&7{victim} no tenia balance suficiente para generar nueva bounty."

skill-rating-system:
  default-mu: 25.0
  default-sigma: 8.333333333333334
  ordinal-sigma-multiplier: 3.0
  skill-rating-scale: 100.0
  tier-thresholds:
    - 500.0
    - 1500.0
    - 2500.0
    - 3500.0

# El build siempre genera ambos packs. Use external-url con una URL publicada,
# El pack Java se publica por HTTP y se envía automáticamente al entrar.
# Para un servidor remoto, reemplazá 127.0.0.1 por la IP o dominio público del servidor.
resource-pack-system:
    required: true
    resend-on-version-change: true
    prompt-message: "Este servidor utiliza modelos, música e interfaces custom."
    bettermodel-java-pack: ""
    publishing:
      mode: embedded-http
      public-url: "http://127.0.0.1:8123/"
      bind-address: "127.0.0.1"
      port: 8123
      worker-threads: 2

custom-item-catalog:
  reconciliation:
    stacks-per-tick: 36

geyser-integration:
  enabled: true
  custom-entities: true
  bedrock-forms: true
  bedrock-resource-pack: true
  custom-items: true
  safe-fallbacks: true

team-system:
  tag:
    minimum-length: 2
    maximum-length: 5
    # Símbolos o emojis adicionales admitidos en tags; letras y números siempre están permitidos.
    allowed-symbols: ["⚔", "★", "❤", "☠", "◆", "✦", "🔥", "🛡"]
  presentation:
    scoreboard-prefix: true
    tab-list-name: true
    display-name: true
    prefer-placeholder-api: true

nexus-system:
  maximum-health: 500.0
  damage:
    allow-natural-entities: false
    allow-unowned-explosions: false
    multipliers:
      melee: 1.0
      projectile: 1.0
      explosion: 1.0
      fire: 0.0
      magic: 1.0
      environment: 0.0
      custom: 1.0
  placement:
    container-clearance-horizontal: 4
    container-clearance-vertical: 3
    minimum-open-faces: 2
    minimum-walkable-width: 2
    prevent-doorway-placement: true

entity-shop-system:
  bedrock:
    use-forms: true
    player-model-fallback: VILLAGER

pve-boss-system:
  ui:
    boss-bar: true
    action-bar: true
    floating-text: true
    update-ticks: 5
  music:
    enabled: true
    vanilla-fallback: true

glider:
  enabled: true
  activation:
    mode: SNEAK
    minimum-fall-speed: -0.05
    allow-survival: true
    allow-adventure: true
    allow-creative: true
  physics:
    tick-rate: 1
    max-session-ticks: 12000
    max-altitude-gain: 2.0
  visual:
    enabled: true
    vertical-offset: 2.55
    scale: 1.55
    yaw-offset-degrees: 0.0
    interpolation-ticks: 3
    teleport-duration-ticks: 2
    view-range: 1.5
  particles:
    enabled: true
    interval: 3
  sounds:
    enabled: true
    start: ITEM_ARMOR_EQUIP_ELYTRA
    boost: ENTITY_FIREWORK_ROCKET_LAUNCH
    landing: BLOCK_WOOL_FALL
  tiers:
    1:
      forward-speed: 0.38
      max-fall-speed: -0.42
      steering: 0.45
      lift: 0.00
      fall-damage-reduction: 0.35
      boost:
        enabled: false
        power: 0.00
        cooldown: 80
    2:
      forward-speed: 0.44
      max-fall-speed: -0.36
      steering: 0.55
      lift: 0.00
      fall-damage-reduction: 0.50
      boost:
        enabled: false
        power: 0.00
        cooldown: 80
