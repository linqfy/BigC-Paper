grappling-hook:
  enabled: true
  # Cómo se activa el gancho. Modos: RIGHT_CLICK, LEFT_CLICK,
  # SNEAK_RIGHT_CLICK, SNEAK_LEFT_CLICK, SWAP_HANDS (tecla F vanilla).
  # Un modo desconocido cae a RIGHT_CLICK con un warning en consola.
  activation:
    mode: RIGHT_CLICK
    # Si se vuelve a activar con una sesión activa: retraer el gancho en vez
    # de disparar de nuevo.
    retract-on-activation: true
  chain:
    enabled: true
    spacing: 1.0
  hook-speed: 1.6
  attach-ticks: 4
  fail-cooldown-ticks: 10
  movement:
    # Recogida fuerte sin borrar el impulso tangencial del balanceo.
    reel-power-multiplier: 0.85
    max-reel-speed: 3.0
    # WASD conserva control aéreo mientras la cuerda está tensa.
    air-control-acceleration: 0.22
    max-horizontal-speed: 2.4
    # Cada pulsación requiere soltar y volver a presionar salto.
    air-jumps: 2
    jump-velocity: 0.7
    # Velocidad de regreso visual al recoger el gancho manualmente.
    retract-speed-multiplier: 2.0
  targeting:
    blocks: true
    entities: true
    players: false
  sounds:
    enabled: true
    chain-interval-ticks: 6
    fire: { sound: BLOCK_PISTON_EXTEND, volume: 0.6, pitch: 1.3 }
    chain: { sound: BLOCK_CHAIN_STEP, volume: 0.3, pitch: 1.2 }
    attach: { sound: BLOCK_CHAIN_HIT, volume: 0.8, pitch: 1.0 }
    impulse: { sound: BLOCK_CHAIN_PLACE, volume: 0.6, pitch: 1.1 }
    fail: { sound: BLOCK_CHAIN_BREAK, volume: 0.4, pitch: 0.9 }
    cooldown: { sound: UI_BUTTON_CLICK, volume: 0.4, pitch: 0.8 }
  feedback:
    enabled: true
    particle-count: 6
  # El impulso es por tier. impulse-power es la ráfaga inicial del tirón en
  # bloques/tick hacia el objetivo (direction = target - player, normalizada);
  # upward-bias es un pequeño apoyo vertical adicional. Mientras la cadena
  # queda tensa se aplica además el tirón configurable de movement hacia el
  # ancla, conservando balanceo, control lateral y saltos. Contra una entidad, la entidad es
  # atraída hacia el jugador (máx 1.4 bloques/tick). La velocidad final se
  # limita siempre a 4.5 bloques/tick (techo de seguridad duro).
  tiers:
    i:   { range: 50.0,  cooldown-seconds: 5.0,  impulse-power: 2.0, upward-bias: 0.25 }
    ii:  { range: 75.0,  cooldown-seconds: 4.25, impulse-power: 2.4, upward-bias: 0.28 }
    iii: { range: 100.0, cooldown-seconds: 3.5,  impulse-power: 2.8, upward-bias: 0.31 }
    iv:  { range: 125.0, cooldown-seconds: 2.75, impulse-power: 3.3, upward-bias: 0.35 }
    v:   { range: 150.0, cooldown-seconds: 2.0,  impulse-power: 3.8, upward-bias: 0.40 }
    vi:  { range: 200.0, cooldown-seconds: 1.25, impulse-power: 4.2, upward-bias: 0.45 }

