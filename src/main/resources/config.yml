airdrop-system:
  # Sistema automático: cuando es false, /airdrop spawn sigue funcionando
  # pero no se genera ningún AirDrop solo.
  automatic: true
  interval-minutes: 60
  # Radio máximo de 10000 bloques alrededor del jugador elegido.
  # El drop cae entre la mitad de esta distancia y el máximo.
  radius: 10000
  drop-height: 30
  debug: false
  quality-chances:
    COMMON: 0.39
    RARE: 0.30
    EPIC: 0.20
    LEGENDARY: 0.10
    GHISTIC: 0.01
  loot-quality-promotion:
    enabled: true
    next-quality-chance:
      COMMON: 0.12
      RARE: 0.10
      EPIC: 0.07
      LEGENDARY: 0.03
      GHISTIC: 0.00
  enchantments:
    allow-curses: false
  qualities:
    COMMON:
      guard-count: 4
      health-multiplier: 1.0
      damage-multiplier: 1.0
      equipment-level: 1
      equipment-drop-chance: 0.05
      loot-rolls: 4
      custom-item-chance: 0.20
      announce-globally: false
    RARE:
      guard-count: 6
      health-multiplier: 1.15
      damage-multiplier: 1.10
      equipment-level: 2
      equipment-drop-chance: 0.03
      loot-rolls: 5
      custom-item-chance: 0.35
      announce-globally: false
    EPIC:
      guard-count: 8
      health-multiplier: 1.30
      damage-multiplier: 1.20
      equipment-level: 3
      equipment-drop-chance: 0.02
      loot-rolls: 6
      custom-item-chance: 0.50
      announce-globally: true
    LEGENDARY:
      guard-count: 11
      health-multiplier: 1.50
      damage-multiplier: 1.35
      equipment-level: 4
      equipment-drop-chance: 0.01
      loot-rolls: 8
      custom-item-chance: 0.70
      announce-globally: true
    GHISTIC:
      guard-count: 15
      health-multiplier: 1.75
      damage-multiplier: 1.50
      equipment-level: 5
      equipment-drop-chance: 0.00
      loot-rolls: 10
      custom-item-chance: 0.90
      announce-globally: true
