# Zeus, jefe de la mazmorra griega. Las dos fases las maneja su encuentro (boss/zeus/ZeusController):
# fase 1 = patrones de rayos en el piso, solo dano cuerpo a cuerpo; fase 2 (desde 50%) = nubes electricas y lanzas
# (solo recibe dano con una lanza clavada). Los umbrales de abajo solo tienen que ser validos.
id: myth-zeus
display-name: "ZEUS"
maximum-health: 1600.0
audience-radius: 48.0

# 1600 de vida para uno solo, +600 por cada jugador extra (hasta 4)
raid-scaling:
  enabled: true
  base-health: 1000.0
  health-per-player: 600.0
  minimum-players: 1
  maximum-players: 4

presentation:
  java-model-key: bigcasares_myth_zeus

ui:
  update-ticks: 5

phases:
  phase-2-at: 0.5
  phase-3-at: 0.01

category-weights:
  physical: 1.0
  magic: 0.5
  movement: 0.5
  defensive: 0.5

animations:
  idle:
    type: LOOPING
    duration-ticks: 60
    scale: [1.0, 1.0]
    y-offset: [0.0, 0.0]
    y-rotation: [0, 0]
    priority: 0
  attack:
    type: ONE_SHOT
    duration-ticks: 20
    scale: [1.0, 1.0]
    y-offset: [0.0, 0.0]
    y-rotation: [0, 0]
    priority: 10
  rage:
    type: ONE_SHOT
    duration-ticks: 50
    scale: [1.0, 1.0]
    y-offset: [0.0, 0.0]
    y-rotation: [0, 0]
    priority: 20

abilities:
  # Fase 1: si te quedas pegado a Zeus, descarga el rayo de la mano a su alrededor.
  golpe:
    category: PHYSICAL
    animation: attack
    cooldown-seconds: 5.0
    cast-time-seconds: 0.9
    priority: 50
    interruptible: false
    conditions:
      - type: TARGET_IN_RANGE
        value: 4.0
      - type: NOT_CASTING
    targets:
      type: ALL_IN_RADIUS
      radius: 4.0
      max-targets: 4
    telegraph:
      type: CIRCLE
      radius: 4.0
      particle: minecraft:electric_spark
      warning-sound: minecraft:entity.evoker.prepare_attack
    effects:
      - type: DAMAGE
        amount: 6.0
      - type: KNOCKBACK
        strength: 1.2

dialogue:
  spawn:
    - "§6⚡ Zeus desciende del Olimpo. §eEsquivá sus rayos y pegale cuerpo a cuerpo: §7las flechas no le hacen nada."
  phase-2:
    - "§6§l¡ZEUS SE ENFURECE!"
  defeat:
    - "§7Zeus cae. El trueno se apaga sobre la mazmorra."

music:
  enabled: true
  radius: 48
  stop-when-leaving-radius: true
  fallback-sound: minecraft:music.dragon
  tracks:
    phase-1: minecraft:music.dragon
    phase-2: minecraft:music.dragon
    phase-3: minecraft:music.dragon
