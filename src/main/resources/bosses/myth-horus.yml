# Horus, jefe mitico de la mazmorra egipcia. Las dos fases las maneja su encuentro (HorusEncounter):
# fase 1 = planeos en picada (se le pega en el piso o al pasar), fase 2 = los Ojos de Horus salen del piso y
# cuando caen todos Horus se deshace en polvo. Las habilidades de este archivo no corren (el encuentro las
# suspende); quedan para cumplir el formato. Los umbrales de fase solo tienen que ser validos.
id: myth-horus
display-name: "HORUS"
maximum-health: 1000.0
audience-radius: 40.0

raid-scaling:
  enabled: true
  base-health: 700.0
  health-per-player: 300.0
  minimum-players: 1
  maximum-players: 4

presentation:
  java-model-key: bigcasares_myth_horus

ui:
  update-ticks: 5

phases:
  phase-2-at: 0.5
  phase-3-at: 0.01

category-weights:
  physical: 1.0
  magic: 0.5
  movement: 0.5
  defensive: 0.5

animations:
  idle:
    type: LOOPING
    duration-ticks: 56
    scale: [1.0, 1.0]
    y-offset: [0.0, 0.0]
    y-rotation: [0, 0]
    priority: 0
  walk:
    type: LOOPING
    duration-ticks: 26
    scale: [1.0, 1.0]
    y-offset: [0.0, 0.0]
    y-rotation: [0, 0]
    priority: 2
  planeo:
    type: LOOPING
    duration-ticks: 40
    scale: [1.0, 1.0]
    y-offset: [0.0, 0.0]
    y-rotation: [0, 0]
    priority: 5
  dive:
    type: LOOPING
    duration-ticks: 12
    scale: [1.0, 1.0]
    y-offset: [0.0, 0.0]
    y-rotation: [0, 0]
    priority: 8
  attack:
    type: ONE_SHOT
    duration-ticks: 22
    scale: [1.0, 1.0]
    y-offset: [0.0, 0.0]
    y-rotation: [0, 0]
    priority: 10
  rage:
    type: ONE_SHOT
    duration-ticks: 40
    scale: [1.0, 1.0]
    y-offset: [0.0, 0.0]
    y-rotation: [0, 0]
    priority: 20
  cast:
    type: ONE_SHOT
    duration-ticks: 32
    scale: [1.0, 1.0]
    y-offset: [0.0, 0.0]
    y-rotation: [0, 0]
    priority: 15
  vanish:
    type: ONE_SHOT
    duration-ticks: 50
    scale: [1.0, 1.0]
    y-offset: [0.0, 0.0]
    y-rotation: [0, 0]
    priority: 30
  death:
    type: ONE_SHOT
    duration-ticks: 20
    scale: [1.0, 1.0]
    y-offset: [0.0, 0.0]
    y-rotation: [0, 0]
    priority: 40

abilities:
  aletazo:
    category: PHYSICAL
    animation: attack
    cooldown-seconds: 6.0
    cast-time-seconds: 0.9
    priority: 50
    interruptible: false
    conditions:
      - type: TARGET_IN_RANGE
        value: 4.5
      - type: NOT_CASTING
    targets:
      type: ALL_IN_RADIUS
      radius: 4.5
      max-targets: 4
    telegraph:
      type: CIRCLE
      radius: 4.5
      particle: minecraft:dust
      warning-sound: minecraft:entity.breeze.inhale
    effects:
      - type: DAMAGE
        amount: 5.0
      - type: KNOCKBACK
        strength: 1.3

dialogue:
  spawn:
    - "§6Horus, el halcón del cielo, despliega las alas sobre la arena."
  phase-2:
    - "§6¡El Ojo de Horus despierta!"
  defeat:
    - "§eHorus se deshizo en polvo. La arena queda en silencio."

music:
  enabled: true
  radius: 40
  stop-when-leaving-radius: true
  fallback-sound: minecraft:music.dragon
  tracks:
    phase-1: minecraft:music.dragon
    phase-2: minecraft:music.dragon
    phase-3: minecraft:music.dragon
