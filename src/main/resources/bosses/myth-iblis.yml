# Iblís y el rey Salomón, jefe de la mazmorra árabe. Las dos fases las maneja su encuentro (boss/iblis/IblisFight):
# fase 1 = Iblís invisible (solo humo), tira fuego, se le pega golpeando el humo; al 50% aparece Salomón y da su
# anillo; fase 2 = con el anillo se arman vasijas y solo se le pega cuando queda atrapado en una. Los umbrales de
# abajo solo tienen que ser validos; la habilidad de la YAML no corre (el encuentro suspende las habilidades).
id: myth-iblis
display-name: "IBLÍS"
maximum-health: 1400.0
audience-radius: 48.0

# 1400 de vida para uno solo, +600 por cada jugador extra (hasta 4)
raid-scaling:
  enabled: true
  base-health: 800.0
  health-per-player: 600.0
  minimum-players: 1
  maximum-players: 4

presentation:
  java-model-key: bigcasares_myth_iblis

ui:
  update-ticks: 5

phases:
  phase-2-at: 0.5
  phase-3-at: 0.01

category-weights:
  physical: 1.0
  magic: 0.5
  movement: 0.5
  defensive: 0.5

animations:
  idle:
    type: LOOPING
    duration-ticks: 60
    scale: [1.0, 1.0]
    y-offset: [0.0, 0.0]
    y-rotation: [0, 0]
    priority: 0
  attack:
    type: ONE_SHOT
    duration-ticks: 20
    scale: [1.0, 1.0]
    y-offset: [0.0, 0.0]
    y-rotation: [0, 0]
    priority: 10
  rage:
    type: ONE_SHOT
    duration-ticks: 40
    scale: [1.0, 1.0]
    y-offset: [0.0, 0.0]
    y-rotation: [0, 0]
    priority: 20

abilities:
  # Nunca se lanza (el encuentro suspende las habilidades): el fuego de Iblís es todo del guion.
  zarpazo:
    category: PHYSICAL
    animation: attack
    cooldown-seconds: 6.0
    cast-time-seconds: 0.9
    priority: 50
    interruptible: false
    conditions:
      - type: TARGET_IN_RANGE
        value: 3.0
      - type: NOT_CASTING
    targets:
      type: ALL_IN_RADIUS
      radius: 3.0
      max-targets: 4
    telegraph:
      type: CIRCLE
      radius: 3.0
      particle: minecraft:flame
      warning-sound: minecraft:entity.blaze.shoot
    effects:
      - type: DAMAGE
        amount: 5.0

dialogue:
  spawn:
    - "§8☁ §7Un humo sin fuego llena la sala... §cIblís, el que no se inclinó, está acá. §fSeguí el humo y pegale."
  phase-2:
    - "§6§l¡EL REY SALOMÓN!"
  defeat:
    - "§6✦ §eIblís vuelve a la vasija. §7El rey Salomón la sella para siempre."

music:
  enabled: true
  radius: 48
  stop-when-leaving-radius: true
  fallback-sound: minecraft:music.nether.basalt_deltas
  tracks:
    phase-1: minecraft:music.nether.basalt_deltas
    phase-2: minecraft:music.nether.soul_sand_valley
    phase-3: minecraft:music.nether.soul_sand_valley
